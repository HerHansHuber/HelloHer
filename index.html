<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloHer — Three.js Crystal Garden</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #172554 0%, #020617 55%, #000 100%);
      color: white;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #scene { width: 100vw; height: 100vh; display: block; }
    .hud {
      position: fixed;
      left: 24px;
      top: 24px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      background: rgba(2, 6, 23, 0.48);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
      max-width: 360px;
    }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 42px); letter-spacing: -0.04em; }
    p { margin: 0; color: #cbd5e1; line-height: 1.45; }
    .tag {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(34,211,238,.22), rgba(168,85,247,.22));
      color: #e0f2fe;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <aside class="hud">
    <h1>Hello, Her ✨</h1>
    <p>A tiny Three.js crystal garden: orbiting gems, glowing particles, and a breathing neon core.</p>
    <span class="tag">Drag to orbit • Scroll to zoom</span>
  </aside>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js';

    const canvas = document.querySelector('#scene');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020617, 0.055);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 3, 8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;

    scene.add(new THREE.AmbientLight(0x99ccff, 0.75));

    const key = new THREE.PointLight(0x22d3ee, 38, 18);
    key.position.set(3, 4, 5);
    scene.add(key);

    const fill = new THREE.PointLight(0xa855f7, 30, 16);
    fill.position.set(-5, 2, -3);
    scene.add(fill);

    const coreMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8,
      emissive: 0x0891b2,
      emissiveIntensity: 1.2,
      roughness: 0.08,
      metalness: 0.05,
      transmission: 0.35,
      thickness: 1.5,
      clearcoat: 1
    });
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 3), coreMaterial);
    scene.add(core);

    const ring = new THREE.Group();
    scene.add(ring);

    const gemGeometry = new THREE.OctahedronGeometry(0.36, 1);
    const colors = [0x22d3ee, 0x60a5fa, 0xa855f7, 0xf472b6, 0x34d399, 0xfacc15];
    const gems = [];

    for (let i = 0; i < 18; i++) {
      const material = new THREE.MeshPhysicalMaterial({
        color: colors[i % colors.length],
        emissive: colors[i % colors.length],
        emissiveIntensity: 0.28,
        roughness: 0.18,
        metalness: 0.2,
        clearcoat: 0.8
      });
      const gem = new THREE.Mesh(gemGeometry, material);
      const angle = (i / 18) * Math.PI * 2;
      const radius = 3.0 + Math.sin(i * 1.7) * 0.55;
      gem.position.set(Math.cos(angle) * radius, Math.sin(i * 2.1) * 0.7, Math.sin(angle) * radius);
      gem.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      gem.userData = { angle, radius, speed: 0.25 + Math.random() * 0.35, bob: Math.random() * Math.PI * 2 };
      ring.add(gem);
      gems.push(gem);
    }

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 900;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 6 + Math.random() * 20;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({ color: 0xdbeafe, size: 0.035, transparent: true, opacity: 0.78 })
    );
    scene.add(stars);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(7, 96),
      new THREE.MeshBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.42 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.65;
    scene.add(floor);

    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      core.rotation.y = t * 0.45;
      core.rotation.x = Math.sin(t * 0.7) * 0.18;
      core.scale.setScalar(1 + Math.sin(t * 2.2) * 0.045);

      ring.rotation.y = t * 0.18;
      gems.forEach((gem, i) => {
        const d = gem.userData;
        const a = d.angle + t * d.speed;
        gem.position.x = Math.cos(a) * d.radius;
        gem.position.z = Math.sin(a) * d.radius;
        gem.position.y = Math.sin(t * 1.6 + d.bob) * 0.55;
        gem.rotation.x += 0.012 + i * 0.0002;
        gem.rotation.y += 0.018;
      });
      stars.rotation.y = t * 0.025;
      stars.rotation.x = Math.sin(t * 0.12) * 0.08;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
